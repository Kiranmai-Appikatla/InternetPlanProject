<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internet Plans</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Internet Plans</h1>
      <a href="/swagger-ui/index.html">API docs</a>
    </header>

    <section class="card">
      <h2 id="form-title">Add a plan</h2>
      <form id="plan-form">
        <input type="hidden" id="plan-id">
        <label>
          Plan name
          <input id="plan-name" name="planName" required maxlength="80">
        </label>
        <label>
          Speed (Mbps)
          <input id="speed" name="speedMbps" type="number" min="1" step="1" required>
        </label>
        <label>
          Monthly fee
          <input id="fee" name="monthlyFee" type="number" min="0" step="0.01" required>
        </label>
        <label class="check">
          <input id="active" name="active" type="checkbox" checked>
          Active
        </label>
        <div class="actions">
          <button id="submit-btn" type="submit">Add plan</button>
          <button id="cancel-btn" type="button" hidden>Cancel</button>
        </div>
      </form>
      <p id="message" role="status"></p>
    </section>

    <section class="card">
      <h2>All plans</h2>
      <table>
        <thead>
          <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Speed</th>
            <th>Fee</th>
            <th>Active</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="plans">
          <tr><td colspan="6">Loading...</td></tr>
        </tbody>
      </table>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
