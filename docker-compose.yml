services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: exam_2400031871
      POSTGRES_USER: kiran
      POSTGRES_PASSWORD: exam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiran -d exam_2400031871"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./CrudServiceProject
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/exam_2400031871
      SPRING_DATASOURCE_USERNAME: kiran
      SPRING_DATASOURCE_PASSWORD: exam
      EUREKA_CLIENT_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
